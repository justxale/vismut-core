[package]
name = "vismut-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Embeddable runtime implementation for node-based visual scripting"
repository = "https://github.com/justxale/vismut-core"

[dependencies]
petgraph = { version = "0.8.3", features = ["stable_graph"] }
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"], optional = true }
rand = { version = "0.10.0", optional = true }
uuid = { version = "1.23.4", optional = true }

[features]
nodes = ["rand"]
serde = ["dep:serde", "uuid?/serde"]
uuid = ["dep:uuid"]